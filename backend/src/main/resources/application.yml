spring:
  application:
    name: taskflow-backend
  datasource:
    url: ${TASKFLOW_DB_URL}
    username: ${TASKFLOW_DB_USERNAME}
    password: ${TASKFLOW_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
  jackson:
    time-zone: UTC

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

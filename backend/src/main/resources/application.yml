spring:
  application:
    name: taskflow-backend
  datasource:
    url: ${TASKFLOW_DB_URL}
    username: ${TASKFLOW_DB_USERNAME}
    password: ${TASKFLOW_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

taskflow:
  security:
    cookies:
      secure: ${TASKFLOW_COOKIE_SECURE:true}
    jwt:
      secret-base64: ${TASKFLOW_JWT_SECRET_BASE64:}

server:
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

# Only application routes; document errors explicitly instead of inferring broad advice responses.
springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false

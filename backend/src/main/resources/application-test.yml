spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: ${TASKFLOW_TEST_DB_URL}
    username: ${TASKFLOW_TEST_DB_USERNAME}
    password: ${TASKFLOW_TEST_DB_PASSWORD}
  flyway:
    enabled: false

taskflow:
  security:
    cookies:
      secure: false
    jwt:
      # TEST ONLY: fixed 32-byte key; never use outside the test profile.
      secret-base64: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  persistence:
    auditing:
      enabled: false

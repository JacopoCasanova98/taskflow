spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: ${TASKFLOW_TEST_DB_URL}
    username: ${TASKFLOW_TEST_DB_USERNAME}
    password: ${TASKFLOW_TEST_DB_PASSWORD}
  flyway:
    enabled: false

taskflow:
  persistence:
    auditing:
      enabled: false

AWSTemplateFormatVersion: "2010-09-09"
Description: TaskFlow reference architecture alternative to Terraform; static validation only, never deploy.

Parameters:
  PublicHostname:
    Type: String
    Description: Required lowercase public DNS hostname covered by the external ACM certificate; no DNS lookup.
    MaxLength: 128
    AllowedPattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z]{2,63}$'

  ManageEcrRegistryScanning:
    Type: String
    Description: Opt in only when this stack owns regional registry scanning; otherwise an external registry prerequisite.
    Default: "false"
    AllowedValues: ["false", "true"]

  ProjectName:
    Type: String
    Description: Project identifier used for naming and tags.
    Default: "taskflow"
    AllowedPattern: '[a-z][a-z0-9]*(-[a-z0-9]+)*'

  Environment:
    Type: String
    Description: Reference environment; prod does not imply a deployed stack.
    Default: "prod"
    AllowedPattern: '[a-z][a-z0-9]*(-[a-z0-9]+)*'

  VpcCidr:
    Type: String
    Description: IPv4 reference CIDR; overrides must preserve containment and non-overlap.
    Default: "10.42.0.0/16"
    AllowedPattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])'

  PublicSubnetACidr:
    Type: String
    Description: IPv4 reference CIDR; overrides must preserve containment and non-overlap.
    Default: "10.42.0.0/24"
    AllowedPattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])'

  PublicSubnetBCidr:
    Type: String
    Description: IPv4 reference CIDR; overrides must preserve containment and non-overlap.
    Default: "10.42.1.0/24"
    AllowedPattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])'

  DatabaseSubnetACidr:
    Type: String
    Description: IPv4 reference CIDR; overrides must preserve containment and non-overlap.
    Default: "10.42.10.0/24"
    AllowedPattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])'

  DatabaseSubnetBCidr:
    Type: String
    Description: IPv4 reference CIDR; overrides must preserve containment and non-overlap.
    Default: "10.42.11.0/24"
    AllowedPattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])'

  Ec2AmiId:
    Type: AWS::EC2::Image::Id
    Description: Required regional AL2023 x86_64 AMI with SSM support; no live lookup.
    AllowedPattern: 'ami-([0-9a-f]{8}|[0-9a-f]{17})'

  Ec2InstanceType:
    Type: String
    Description: Reference x86_64 instance type; compatibility is an operator check.
    Default: "t3.medium"
    AllowedPattern: '[a-z][a-z0-9]*[.][a-z0-9]+'

  RootVolumeSizeGiB:
    Type: Number
    Description: Encrypted gp3 root size; must fit the selected AMI.
    Default: 30
    MinValue: 30
    MaxValue: 16384

  RootDeviceName:
    Type: String
    Description: AMI root block-device mapping name; operator must verify for the selected AL2023 image.
    Default: "/dev/xvda"
    AllowedPattern: '/dev/[a-zA-Z0-9]+'

  AcmCertificateArn:
    Type: String
    Description: Required externally managed certificate in the ALB region; no certificate or DNS lookup.
    AllowedPattern: 'arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+'

  DbEngineVersion:
    Type: String
    Description: PostgreSQL 17 reference major or minor; no regional availability lookup.
    Default: "17"
    AllowedPattern: '17([.][0-9]+)?'

  DbInstanceClass:
    Type: String
    Description: Reference sizing assumption; orderability remains an operator check.
    Default: "db.t4g.micro"
    AllowedPattern: 'db[.][a-z0-9]+[.][a-z0-9]+'

Conditions:
  ManageRegistryScanning: !Equals [!Ref ManageEcrRegistryScanning, "true"]

Resources:
  # Replaces regional registry scanning configuration, not just matching repositories.
  # Default-off ownership guard; external registry owner supplies scanning otherwise.
  RegistryScanningConfiguration:
    Type: AWS::ECR::RegistryScanningConfiguration
    Condition: ManageRegistryScanning
    Properties:
      ScanType: BASIC
      Rules:
        - ScanFrequency: SCAN_ON_PUSH
          RepositoryFilters:
            - Filter: !Sub '${ProjectName}-${Environment}-*'
              FilterType: WILDCARD

  # Networking: database route table deliberately has only the implicit local route.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpc'
        - Key: Component
          Value: networking

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Sub '${AWS::Region}a'
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-a'
        - Key: Component
          Value: networking
        - Key: Tier
          Value: public

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Sub '${AWS::Region}b'
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-b'
        - Key: Component
          Value: networking
        - Key: Tier
          Value: public

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DatabaseSubnetACidr
      AvailabilityZone: !Sub '${AWS::Region}a'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-database-a'
        - Key: Component
          Value: networking
        - Key: Tier
          Value: database

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DatabaseSubnetBCidr
      AvailabilityZone: !Sub '${AWS::Region}b'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-database-b'
        - Key: Component
          Value: networking
        - Key: Tier
          Value: database

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-igw'
        - Key: Component
          Value: networking

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-rt'
        - Key: Component
          Value: networking
        - Key: Tier
          Value: public

  DatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-database-rt'
        - Key: Component
          Value: networking
        - Key: Tier
          Value: database

  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  DatabaseRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnetA
      RouteTableId: !Ref DatabaseRouteTable

  DatabaseRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnetB
      RouteTableId: !Ref DatabaseRouteTable

  # AWS-documented localhost sentinel suppresses default allow-all egress.
  # It adds no routable egress capability. Actual paths use standalone rules.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-alb-sg'
      GroupDescription: Public HTTP redirect and HTTPS entry
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: Localhost sentinel suppresses default allow-all egress
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alb-sg'
        - Key: Component
          Value: security
        - Key: Tier
          Value: edge

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-app-sg'
      GroupDescription: ALB-only frontend ingress and explicit service egress
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: Localhost sentinel suppresses default allow-all egress
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-app-sg'
        - Key: Component
          Value: security
        - Key: Tier
          Value: application

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-db-sg'
      GroupDescription: Application-only PostgreSQL ingress
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: Localhost sentinel suppresses default allow-all egress
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-db-sg'
        - Key: Component
          Value: security
        - Key: Tier
          Value: database

  AlbHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Public HTTP redirect-only traffic
      GroupId: !GetAtt AlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  AlbHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Public HTTPS application traffic
      GroupId: !GetAtt AlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0

  AlbAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: ALB to frontend Nginx
      GroupId: !GetAtt AlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !GetAtt AppSecurityGroup.GroupId

  AppAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Frontend Nginx from ALB only
      GroupId: !GetAtt AppSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId

  AppDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: Application to PostgreSQL
      GroupId: !GetAtt AppSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !GetAtt DatabaseSecurityGroup.GroupId

  AppHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: HTTPS services and host bootstrap in the no-NAT design
      GroupId: !GetAtt AppSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0

  DatabaseAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: PostgreSQL from application only
      GroupId: !GetAtt DatabaseSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt AppSecurityGroup.GroupId

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}-frontend'
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after seven days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},"action":{"type":"expire"}}]}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: frontend

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}-backend'
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after seven days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},"action":{"type":"expire"}}]}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: backend

  ApplicationDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}-${Environment}/database/application'
      Description: Future application PostgreSQL username and password; metadata only
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: database

  JwtSigningSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}-${Environment}/jwt/signing'
      Description: Future TASKFLOW_JWT_SECRET_BASE64 value decoding to 32 bytes; metadata only
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: application

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${ProjectName}/${Environment}/backend'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: backend

  NginxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${ProjectName}/${Environment}/nginx'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: nginx

  HostLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${ProjectName}/${Environment}/host'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: host

  PostgresLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/rds/instance/${ProjectName}-${Environment}-db/postgresql'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: database

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-app'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-ecr-pull'
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  - !GetAtt FrontendRepository.Arn
                  - !GetAtt BackendRepository.Arn
        - PolicyName: !Sub '${ProjectName}-${Environment}-telemetry'
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # CloudFormation LogGroup.Arn already includes the trailing :*.
                Resource:
                  - !GetAtt BackendLogGroup.Arn
                  - !GetAtt NginxLogGroup.Arn
                  - !GetAtt HostLogGroup.Arn
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub 'TaskFlow/${Environment}'
        - PolicyName: !Sub '${ProjectName}-${Environment}-application-secrets'
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref ApplicationDatabaseSecret
                  - !Ref JwtSigningSecret
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: compute

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ProjectName}-${Environment}-app'
      Roles:
        - !Ref AppRole

  AppInstance:
    Type: AWS::EC2::Instance
    # First boot needs an attached gateway, routing, HTTPS egress and role policies.
    DependsOn:
      - GatewayAttachment
      - PublicInternetRoute
      - PublicRouteAssociationA
      - AppHttpsEgress
    Properties:
      ImageId: !Ref Ec2AmiId
      InstanceType: !Ref Ec2InstanceType
      IamInstanceProfile: !Ref AppInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: !Ref PublicSubnetA
          GroupSet:
            - !GetAtt AppSecurityGroup.GroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        InstanceMetadataTags: disabled
      BlockDeviceMappings:
        - DeviceName: !Ref RootDeviceName
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      PropagateTagsToVolumeOnCreation: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail

          # Amazon Linux 2023 x86_64 host preparation only; no application deployment.
          dnf install -y docker amazon-ssm-agent amazon-cloudwatch-agent
          command -v aws >/dev/null || dnf install -y awscli-2
          command -v jq >/dev/null || dnf install -y jq
          command -v python3 >/dev/null || dnf install -y python3
          command -v iptables >/dev/null || dnf install -y iptables-nft
          command -v flock >/dev/null || dnf install -y util-linux
          command -v nft >/dev/null || dnf install -y nftables
          aws --version | grep -q '^aws-cli/2\.'
          command -v jq python3 iptables flock nft >/dev/null
          install -d -o root -g root -m 0750 /opt/taskflow /var/log/taskflow
          install -d -o root -g root -m 0700 /opt/taskflow/config
          cat >/etc/tmpfiles.d/taskflow.conf <<'TMPFILES'
          d /run/taskflow 0700 root root -
          d /run/taskflow/secrets 0700 root root -
          TMPFILES
          systemd-tmpfiles --create /etc/tmpfiles.d/taskflow.conf

          # Require Docker's iptables forwarding model (including iptables-nft compatibility).
          # Native Docker nftables backend has no DOCKER-USER chain and is not supported.
          cat >/usr/local/sbin/taskflow-imds-guard <<'GUARD'
          #!/bin/bash
          set -euo pipefail
          # Refuse native Docker nftables tables, including a migration leaving stale iptables chains.
          tables=$(nft list tables)
          if printf '%s\n' "$tables" | grep -Eq '^table (ip|ip6) docker-bridges$'; then
            echo 'TaskFlow requires the Docker iptables firewall backend.' >&2
            exit 1
          fi
          if [[ $* == --prepare ]]; then
            # Protect automatically restored containers before dockerd starts. Docker reuses
            # this user chain; the post-start pass verifies its forwarding integration.
            iptables -w -n -L DOCKER-USER >/dev/null 2>&1 || iptables -w -N DOCKER-USER
            iptables -w -C FORWARD -j DOCKER-USER 2>/dev/null || iptables -w -I FORWARD 1 -j DOCKER-USER
          else
            iptables -w -n -L DOCKER-USER >/dev/null
            iptables -w -C FORWARD -j DOCKER-USER
          fi
          if ! iptables -w -C DOCKER-USER -d 169.254.169.254/32 -j REJECT 2>/dev/null; then
            iptables -w -I DOCKER-USER 1 -d 169.254.169.254/32 -j REJECT
          fi
          GUARD
          chmod 0750 /usr/local/sbin/taskflow-imds-guard
          install -d -o root -g root -m 0755 /etc/systemd/system/docker.service.d
          cat >/etc/systemd/system/docker.service.d/taskflow-imds.conf <<'UNIT'
          [Service]
          ExecStartPre=/usr/local/sbin/taskflow-imds-guard --prepare
          ExecStartPost=/usr/local/sbin/taskflow-imds-guard
          UNIT
          systemctl daemon-reload
          systemctl enable docker
          # Restart also applies the guard when bootstrap is rerun on an existing host.
          # A failed ExecStartPost makes Docker startup fail visibly; never ignore it.
          systemctl restart docker
          systemctl enable --now amazon-ssm-agent
          # No retrieval here. MS9.7 owns controlled materialization/application sequencing;
          # MS9.6 owns CloudWatch collection configuration.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-app'
        - Key: Component
          Value: compute
        - Key: Tier
          Value: application

  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-alb'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !GetAtt AlbSecurityGroup.GroupId
      LoadBalancerAttributes:
        - Key: routing.http.xff_header_processing.mode
          Value: append
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "true"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: compute
        - Key: Tier
          Value: edge

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-app'
      TargetType: instance
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref Vpc
      Targets:
        - Id: !Ref AppInstance
          Port: 8080
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /internal/health
      Matcher:
        HttpCode: "200"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: compute

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: compute

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            StatusCode: "404"
            MessageBody: Not found
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: compute

  InternalHealthBlock:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /internal/*
              - /actuator
              - /actuator/*
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            StatusCode: "404"
            MessageBody: Not found
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: compute

  DocumentationBlock:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 2
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/swagger-ui*", "/v3/api-docs*"]
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            StatusCode: "404"
            MessageBody: Not found

  PublicHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref PublicHostname]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${ProjectName}-${Environment}-db'
      DBSubnetGroupDescription: Isolated database subnets across two logical AZs
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-db'
        - Key: Component
          Value: database
        - Key: Tier
          Value: database

  PostgresDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    DependsOn: PostgresLogGroup
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-${Environment}-db'
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      DBName: taskflow
      MasterUsername: taskflowadmin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      PubliclyAccessible: false
      MultiAZ: false
      AvailabilityZone: !Sub '${AWS::Region}a'
      Port: "5432"
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: false
      DeletionProtection: true
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      AllowMajorVersionUpgrade: false
      ApplyImmediately: false
      EnableIAMDatabaseAuthentication: false
      EnablePerformanceInsights: false
      DatabaseInsightsMode: standard
      MonitoringInterval: 0
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-db'
        - Key: Component
          Value: database
        - Key: Tier
          Value: database

  Ec2StatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-ec2-status'
      AlarmDescription: EC2 status check failure for two minutes; notifications are not connected.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Statistic: Maximum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      Period: 60
      EvaluationPeriods: 2
      TreatMissingData: missing
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: observability

  Ec2CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-ec2-cpu'
      AlarmDescription: EC2 CPU above 80 percent for fifteen minutes; notifications are not connected.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      ComparisonOperator: GreaterThanThreshold
      Threshold: 80
      Period: 300
      EvaluationPeriods: 3
      TreatMissingData: missing
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: observability

  AlbHealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-alb-healthy'
      AlarmDescription: No healthy application target for two minutes; notifications are not connected.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Statistic: Minimum
      ComparisonOperator: LessThanThreshold
      Threshold: 1
      Period: 60
      EvaluationPeriods: 2
      TreatMissingData: breaching
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt AppLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt AppTargetGroup.TargetGroupFullName
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: observability

  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-alb-5xx'
      AlarmDescription: At least five ALB-generated 5xx responses per five minutes twice; notifications are not connected.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Statistic: Sum
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 5
      Period: 300
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt AppLoadBalancer.LoadBalancerFullName
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: observability

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-rds-cpu'
      AlarmDescription: RDS CPU above 80 percent for fifteen minutes; notifications are not connected.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Statistic: Average
      ComparisonOperator: GreaterThanThreshold
      Threshold: 80
      Period: 300
      EvaluationPeriods: 3
      TreatMissingData: missing
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref PostgresDatabase
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: database

  RdsStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-rds-storage'
      AlarmDescription: RDS free storage below 5 GiB for fifteen minutes; notifications are not connected.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Statistic: Minimum
      ComparisonOperator: LessThanThreshold
      Threshold: 5368709120
      Period: 300
      EvaluationPeriods: 3
      TreatMissingData: missing
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref PostgresDatabase
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Component
          Value: database

Outputs:
  ReferenceRegion:
    Description: Reference region; no stack is deployed.
    Value: !Ref AWS::Region

  Environment:
    Description: Reference environment being modelled.
    Value: !Ref Environment

  NamePrefix:
    Description: Canonical project-environment naming prefix.
    Value: !Sub '${ProjectName}-${Environment}'

  AlbDnsName:
    Description: AWS-generated ALB hostname, not the final TaskFlow domain; no ALB exists.
    Value: !GetAtt AppLoadBalancer.DNSName

  AlbZoneId:
    Description: ALB hosted-zone identifier for hypothetical alias integration.
    Value: !GetAtt AppLoadBalancer.CanonicalHostedZoneID

  AppInstanceId:
    Description: Reference application instance identifier for SSM and diagnostics.
    Value: !Ref AppInstance

  VpcId:
    Description: Reference VPC identifier for external infrastructure integrations.
    Value: !Ref Vpc

  PublicSubnetAId:
    Description: Public subnet identifier for logical AZ a.
    Value: !Ref PublicSubnetA

  PublicSubnetBId:
    Description: Public subnet identifier for logical AZ b.
    Value: !Ref PublicSubnetB

  DatabaseSubnetAId:
    Description: Database subnet identifier for logical AZ a.
    Value: !Ref DatabaseSubnetA

  DatabaseSubnetBId:
    Description: Database subnet identifier for logical AZ b.
    Value: !Ref DatabaseSubnetB

  AlbSecurityGroupId:
    Description: Alb security boundary identifier.
    Value: !GetAtt AlbSecurityGroup.GroupId

  AppSecurityGroupId:
    Description: App security boundary identifier.
    Value: !GetAtt AppSecurityGroup.GroupId

  DatabaseSecurityGroupId:
    Description: Database security boundary identifier.
    Value: !GetAtt DatabaseSecurityGroup.GroupId

  FrontendEcrRepositoryUrl:
    Description: Frontend image repository URL for conceptual release integration.
    Value: !GetAtt FrontendRepository.RepositoryUri

  BackendEcrRepositoryUrl:
    Description: Backend image repository URL for conceptual release integration.
    Value: !GetAtt BackendRepository.RepositoryUri

  DatabaseEndpoint:
    Description: Private RDS hostname within the approved network boundary, not a credential; no database exists.
    Value: !GetAtt PostgresDatabase.Endpoint.Address

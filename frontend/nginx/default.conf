server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $hsts always;
    add_header Cache-Control $cache_control;

    # Docker DNS allows backend replacement without baking its container IP into Nginx.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8080;

    # Target probes bypass ALB listeners; public /internal/* is blocked there.
    location = /internal/health {
        if ($alb_peer = 0) { return 404; }
        proxy_pass $backend/actuator/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location ~* ^/(?:internal|actuator|swagger-ui|v3/api-docs) {
        return 404;
    }
    location ~ ^/api/auth/(?:login|register)$ {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/taskflow-proxy.conf;
    }

    # Keep this before static-file regexes: /api, all API paths and misses go upstream.
    location ~ ^/api(?:/|$) {
        include /etc/nginx/taskflow-proxy.conf;
    }

    location ~ /\. {
        deny all;
    }

    # Missing files are real 404s, never HTML with a JavaScript/CSS content type.
    location ~* \.(?:js|css|map|json|ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

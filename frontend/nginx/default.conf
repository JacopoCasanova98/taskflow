server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $cache_control;

    # Docker DNS allows backend replacement without baking its container IP into Nginx.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8080;

    # Keep this before static-file regexes: /api, all API paths and misses go upstream.
    location ~ ^/api(?:/|$) {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Emit one consistent copy of these headers; cookies remain untouched.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location ~ /\. {
        deny all;
    }

    # Missing files are real 404s, never HTML with a JavaScript/CSS content type.
    location ~* \.(?:js|css|map|json|ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

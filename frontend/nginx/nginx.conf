worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Writable runtime paths for the official image's nginx user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only Angular's hashed JS/CSS bundles are immutable. API caching is upstream-owned.
    map $uri $cache_control {
        default "no-cache, must-revalidate";
        ~^/api(?:/|$) "";
        "~^/[^/]+-[A-Za-z0-9_-]{8}\\.(?:js|css)$" "public, max-age=31536000, immutable";
    }

    include /etc/nginx/conf.d/*.conf;
}

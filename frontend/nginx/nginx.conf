worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Writable runtime paths for the official image's nginx user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only Angular's hashed JS/CSS bundles are immutable. API caching is upstream-owned.
    map $uri $cache_control {
        default "no-cache, must-revalidate";
        ~^/api(?:/|$) "";
        "~^/[^/]+-[A-Za-z0-9_-]{8}\\.(?:js|css)$" "public, max-age=31536000, immutable";
    }

    # Peer trust is checked before RealIP rewriting. Keep aligned with ALB subnets.
    set_real_ip_from 10.42.0.0/24;
    set_real_ip_from 10.42.1.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    geo $realip_remote_addr $alb_peer {
        default 0;
        10.42.0.0/24 1;
        10.42.1.0/24 1;
    }
    map "$alb_peer:$http_x_forwarded_proto:$http_x_forwarded_port" $external_scheme {
        default $scheme;
        "1:https:443" https;
    }
    map $external_scheme $external_port {
        default $server_port;
        https 443;
    }
    map $external_scheme $hsts {
        default "";
        https "max-age=31536000";
    }
    # Empty keys exempt direct local development; production ingress is ALB-only.
    map $alb_peer $auth_limit_key {
        default "";
        1 $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=30r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}

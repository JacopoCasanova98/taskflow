# Included only by API locations. No proxy cache; request headers/cookies pass through.
proxy_pass $backend$request_uri;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $external_scheme;
proxy_set_header X-Forwarded-Port $external_port;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Prefix "";
# One edge-owned value; preserve Set-Cookie and upstream API cache controls.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;

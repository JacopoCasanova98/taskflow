<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); mainContent.focus()">
  Skip to content
</a>

<header class="app-header">
  <a class="brand" routerLink="/" aria-label="TaskFlow home">
    <img src="taskflow-mark.svg" width="36" height="36" alt="" />
    <span>TaskFlow</span>
  </a>
  @if (session.isAuthenticated()) {
    <nav aria-label="Main navigation">
      <a
        routerLink="/boards"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        >Boards</a
      >
    </nav>
  }
  <app-auth-controls />
</header>

<main #mainContent id="main-content" tabindex="-1">
  <router-outlet />
</main>

<button
  class="add-task"
  type="button"
  [attr.aria-label]="'Add task to ' + lane().column.name"
  [disabled]="management.busy() || management.creatingIn() !== null"
  (click)="management.creatingIn.set(lane().column.id)"
>
  Add task
</button>
@if (lane().tasks.length === 0) {
  <p class="empty-lane">No tasks yet.</p>
} @else if (
  visibleTasks().length === 0 && (!view.search.active() || view.search.status() === 'ready')
) {
  <p>{{ view.emptyMessage() }}</p>
}
<ul
  [attr.aria-label]="'Tasks in ' + lane().column.name"
  cdkDropList
  [cdkDropListData]="dropData()"
  [cdkDropListDisabled]="dragDisabled()"
  (cdkDropListDropped)="management.drop($event)"
  [class.empty-drop-list]="lane().tasks.length === 0 && view.manual()"
>
  @for (task of visibleTasks(); track task.id) {
    <li class="task" cdkDrag [cdkDragData]="task.id" [cdkDragDisabled]="dragDisabled()">
      <button
        class="task-title"
        type="button"
        [attr.aria-label]="'View task: ' + task.title"
        [disabled]="management.busy()"
        (click)="management.selectedId.set(task.id)"
      >
        {{ task.title }}
      </button>
      <div class="task-meta">
        <app-task-priority-indicator [priority]="task.priority" />
        @if (task.dueDate) {
          <app-task-due-indicator [dueDate]="task.dueDate" />
        }
      </div>
      <button
        class="task-grip"
        type="button"
        cdkDragHandle
        [attr.aria-label]="'Drag ' + task.title"
        title="Drag to move task"
      >
        <span aria-hidden="true">⠿</span>
      </button>
    </li>
  }
</ul>

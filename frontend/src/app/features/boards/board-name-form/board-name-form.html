<form novalidate (submit)="onSubmit($event)" [attr.aria-busy]="nameForm().submitting()">
  <label [for]="inputId()">Board name</label>
  <input
    #nameInput
    [id]="inputId()"
    type="text"
    [formField]="nameForm.name"
    [attr.aria-invalid]="nameForm.name().touched() && nameForm.name().invalid()"
    [attr.aria-describedby]="inputId() + '-errors'"
  />
  <div [id]="inputId() + '-errors'" class="errors" aria-live="polite">
    @if (nameForm.name().touched()) {
      @for (error of nameForm.name().errors(); track $index) {
        <p>{{ error.message }}</p>
      }
    }
    <p>{{ serverError() }}</p>
  </div>
  <div class="actions tf-dialog-actions">
    <button type="button" [disabled]="nameForm().submitting()" (click)="closed.emit()">
      Cancel
    </button>
    <button class="primary" type="submit" [disabled]="nameForm().submitting()">
      {{ nameForm().submitting() ? 'Saving…' : action() }}
    </button>
  </div>
</form>

<p class="progress" role="status">{{ nameForm().submitting() ? 'Saving board…' : '' }}</p>

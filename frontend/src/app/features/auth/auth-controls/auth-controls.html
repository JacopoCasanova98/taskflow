@if (session.isAuthenticated()) {
  <button appIconButton="Account menu" [cdkMenuTriggerFor]="accountMenu" [disabled]="submitting()">
    <app-icon name="account" />
  </button>
  <ng-template #accountMenu>
    <div cdkMenu class="tf-menu" aria-label="Account">
      <p class="identity">{{ session.user()?.email }}</p>
      <button
        cdkMenuItem
        type="button"
        [cdkMenuItemDisabled]="submitting()"
        (cdkMenuItemTriggered)="logout()"
      >
        Log out
      </button>
    </div>
  </ng-template>
  <p
    class="status"
    [class.error]="error()"
    [class.empty]="!submitting() && !error()"
    aria-live="polite"
  >
    {{ submitting() ? 'Logging out…' : error() }}
  </p>
}
